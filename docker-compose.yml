# ─────────────────────────────────────────────────────────────────────────────
# PathogenIQ — Local Development Stack
#
# Services:
#   postgres  — primary relational store (documents, outbreaks, evidence)
#   neo4j     — knowledge graph (pathogen-drug-mutation relationships)
#   qdrant    — vector database (semantic search over literature)
#   redis     — task queue and cache (background jobs in Phase 2)
#   api       — FastAPI application
#
# Usage:
#   docker compose up -d          # start all services detached
#   docker compose logs -f api    # tail api logs
#   docker compose down -v        # stop and delete volumes (DESTRUCTIVE)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  # Primary relational store. Holds source documents, outbreak events,
  # evidence scores, citations, and alert records.
  postgres:
    image: postgres:16-alpine
    container_name: pathogeniq_postgres
    environment:
      POSTGRES_USER: pathogeniq
      POSTGRES_PASSWORD: pathogeniq_secret
      POSTGRES_DB: pathogeniq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathogeniq -d pathogeniq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Neo4j 5 ───────────────────────────────────────────────────────────────
  # Graph database. Models relationships: Pathogen → Mutation → Drug,
  # Outbreak → Location → Risk, Paper → Claim → Evidence.
  # APOC plugin enables advanced graph algorithms.
  neo4j:
    image: neo4j:5.26-community
    container_name: pathogeniq_neo4j
    environment:
      NEO4J_AUTH: neo4j/pathogeniq_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (application driver)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Qdrant ────────────────────────────────────────────────────────────────
  # Vector database. Stores embeddings of scientific abstracts, outbreak
  # reports, and clinical trial summaries for semantic similarity search.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: pathogeniq_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  # Message broker and cache. In Phase 2: task queues for feed collectors.
  # In Phase 3: caching LLM responses to reduce API costs.
  redis:
    image: redis:7-alpine
    container_name: pathogeniq_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama ────────────────────────────────────────────────────────────────
  # Local LLM server — free, no API key, OpenAI-compatible API at :11434/v1.
  # Agents use this by default. Switch to Groq/OpenRouter by overriding
  # LLM_BASE_URL, LLM_MODEL, LLM_API_KEY in .env without touching the code.
  #
  # First run: pull a model inside the container:
  #   docker compose exec ollama ollama pull llama3.2
  # Or let setup.sh do it automatically.
  #
  # GPU acceleration (optional): add `deploy: resources: reservations: devices:`
  # with driver=nvidia and capabilities=[gpu] if you have an NVIDIA GPU.
  ollama:
    image: ollama/ollama:latest
    container_name: pathogeniq_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── API (FastAPI) ─────────────────────────────────────────────────────────
  # Main application. Hot-reload enabled in development via volume mount.
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    container_name: pathogeniq_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pathogeniq:pathogeniq_secret@postgres:5432/pathogeniq
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pathogeniq_secret
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:0.5b
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── Worker (ARQ) ──────────────────────────────────────────────────────────
  # Background task worker that runs data collection on a schedule.
  #
  # Same Docker image as the API — we reuse the same codebase, just with
  # a different entrypoint. This avoids maintaining a separate Dockerfile.
  #
  # WHY A SEPARATE SERVICE?
  #   - The API handles HTTP requests (latency-sensitive, short-lived).
  #   - The worker runs long data collection jobs (1–60 seconds, CPU+IO bound).
  #   - Separating them means a slow collection job never blocks an API request.
  #   - In production (Phase 6), you can scale workers independently:
  #     docker compose up --scale worker=3 (three parallel workers)
  #
  # The worker has NO exposed ports — it only talks to Redis and PostgreSQL.
  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: development
    container_name: pathogeniq_worker
    command: arq app.workers.settings.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pathogeniq:pathogeniq_secret@postgres:5432/pathogeniq
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: pathogeniq_secret
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5:0.5b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
  ollama_data:
