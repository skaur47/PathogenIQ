[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathogeniq-api"
version = "0.1.0"
description = "PathogenIQ — Real-time infectious disease intelligence API"
requires-python = ">=3.11"

# ─────────────────────────────────────────────────────────────────────────────
# Runtime dependencies
#
# fastapi              — async web framework with automatic OpenAPI docs
# uvicorn[standard]    — ASGI server; [standard] adds websocket support
# sqlalchemy[asyncio]  — ORM + async engine; asyncio extra pulls in greenlet
# asyncpg              — fast async PostgreSQL driver (pure C)
# alembic              — schema migrations for SQLAlchemy
# pydantic             — data validation and serialization (FastAPI uses this)
# pydantic-settings    — load config from .env files into typed Settings class
# tenacity             — retry logic with exponential backoff
# structlog            — structured (JSON) logging; machine-readable in prod
# httpx                — async HTTP client for calling external APIs
# python-dotenv        — load .env file into os.environ
# neo4j                — official Neo4j async driver
# qdrant-client        — Qdrant vector database async client
# redis                — Redis async client (aioredis-compatible)
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0.0",
    "structlog>=25.1.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "neo4j>=5.28.0",
    "qdrant-client>=1.13.3",
    "redis[hiredis]>=5.2.1",
    # Phase 2 — data ingestion
    # arq: async Redis Queue — background tasks and cron scheduling without
    #   the overhead of Celery. Uses Redis (already in our stack) as the broker.
    "arq>=0.26.1",
    # feedparser: battle-tested RSS/Atom feed parser used for CDC and WHO feeds.
    #   We fetch the raw XML with httpx (async) then parse with feedparser (sync, fast).
    "feedparser>=6.0.11",
    # trafilatura: main-content extractor for news and health authority article pages.
    #   Strips navigation, ads, and boilerplate; returns clean body text. Used by
    #   collectors/fetch.py to enrich documents with full article text beyond the RSS summary.
    "trafilatura>=1.9.0",
    # Phase 3 — AI agents
    # langgraph: state-machine framework for multi-step LLM agent workflows.
    #   Provides the StateGraph primitive used by Sentinel and Scholar agents.
    "langgraph>=0.2.0",
    # langchain-openai: LangChain binding for any OpenAI-compatible API.
    #   Used by get_llm() in agents/llm.py. Works with Ollama (free, local),
    #   Groq free tier, LM Studio, OpenRouter, or the real OpenAI API —
    #   controlled entirely by LLM_BASE_URL / LLM_MODEL / LLM_API_KEY env vars.
    "langchain-openai>=0.3.0",
    # langchain-core: base abstractions (messages, runnables) shared across
    #   LangChain/LangGraph integrations. Required transitive dep of the above.
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
# Development and testing tools — NOT installed in production image
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",               # async test client for FastAPI
    "aiosqlite>=0.21.0",           # SQLite async driver for in-memory test DB
    "black>=25.1.0",               # code formatter
    "ruff>=0.9.0",                 # linter (replaces flake8 + isort + more)
    "mypy>=1.14.0",                # static type checker
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"          # all async test functions run without @pytest.mark.asyncio
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# ── ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # line length handled by black

# ── mypy (type checker) ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
