# Alembic configuration
# This file is read by `alembic` CLI commands.
# Most real configuration is in app/db/migrations/env.py.

[alembic]
# Path to the migrations directory, relative to where alembic is run
script_location = app/db/migrations

# Template for migration filenames
# %(rev)s = short revision hash
# %(slug)s = description you provide with alembic revision -m "..."
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

# Truncate long slugs in filenames to this length
truncate_slug_length = 40

# SQLAlchemy URL — overridden at runtime by env.py reading from pydantic Settings
# This default is only used if env.py doesn't override it (shouldn't happen).
sqlalchemy.url = postgresql+asyncpg://pathogeniq:pathogeniq_secret@localhost:5432/pathogeniq

[post_write_hooks]
# Automatically run black formatter on newly generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
