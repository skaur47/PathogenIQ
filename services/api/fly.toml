app = "pathogeniq-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  target = "production"

# Two process groups share one Docker image but run different commands.
# "api"    — serves HTTP traffic
# "worker" — runs ARQ cron scheduler 24/7 (data collection + AI pipeline)
[processes]
  api    = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
  worker = "arq app.workers.settings.WorkerSettings"

[[vm]]
  processes = ["api"]
  cpu_kind  = "shared"
  cpus      = 1
  memory    = "512mb"

[[vm]]
  processes = ["worker"]
  cpu_kind  = "shared"
  cpus      = 1
  memory    = "512mb"

[http_service]
  internal_port        = 8000
  force_https          = true
  processes            = ["api"]
  auto_stop_machines   = false
  min_machines_running = 1

[env]
  ENVIRONMENT = "production"
