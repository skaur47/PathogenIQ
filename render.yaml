services:
  - type: web
    name: pathogeniq-api
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: services/api
    plan: free
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      # Set these as secrets in the Render dashboard:
      # DATABASE_URL       — Neon connection string (postgresql+asyncpg://...)
      # NEO4J_URI          — Neo4j Aura (neo4j+s://...)
      # NEO4J_USER         — neo4j
      # NEO4J_PASSWORD     — from Aura dashboard
      # QDRANT_URL         — Qdrant Cloud cluster URL
      # QDRANT_API_KEY     — from Qdrant Cloud dashboard
      # REDIS_URL          — Upstash Redis URL (rediss://...)
      # LLM_BASE_URL       — https://api.groq.com/openai/v1
      # LLM_MODEL          — llama-3.3-70b-versatile
      # LLM_API_KEY        — your Groq API key
      # CORS_ORIGINS       — https://your-app.vercel.app
